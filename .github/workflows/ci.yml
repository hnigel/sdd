name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 這個 repo 刻意零依賴：plugin 是被 /plugin install 裝到別人機器上的，
      # 使用者不會跑 npm install ⇒ 任何 runtime 依賴都等於「在別人機器上不會動」。
      - name: 形狀檢查（manifest / frontmatter / 指到的腳本存不存在 / 範例過不過 schema）
        run: node scripts/validate-plugin.mjs

      - name: 測試
        run: node --test plugins/spec-pipeline/tests/*.test.mjs
